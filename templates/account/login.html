{% extends '_base.html' %}

{% block title %}Entrar - Quadras Esportivas{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-4">Entrar</h2>
                    
                    <form method="POST" action="{% url 'account_login' %}">
                        {% csrf_token %}
                        
                        {% if form.errors %}
                            <div class="alert alert-danger">
                                <strong>Erro!</strong> Verifique seu e-mail e senha.
                            </div>
                        {% endif %}
                        
                        <div class="mb-3">
                            <label for="id_login" class="form-label">E-mail</label>
                            <input type="email" name="login" class="form-control" id="id_login" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="id_password" class="form-label">Senha</label>
                            <input type="password" name="password" class="form-control" id="id_password" required>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" name="remember" class="form-check-input" id="id_remember">
                            <label class="form-check-label" for="id_remember">Lembrar-me</label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2">Entrar</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p>Não tem uma conta? <a href="{% url 'usuarios:signup' %}">Cadastre-se</a></p>
                        <p><a href="{% url 'account_reset_password' %}">Esqueceu sua senha?</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
